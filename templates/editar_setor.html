{% extends "base.html" %}

{% block conteudo %}

<div class="cabecalho-pagina">

    <div>

        <h1 class="titulo-pagina">
            Editar Setor
        </h1>

        <p class="subtitulo">
            Atualize as informações do setor.
        </p>

    </div>

    <a href="{{ url_for('listar_setores') }}"
       class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>

        Voltar

    </a>

</div>


<div class="card">

    <div class="cabecalho-card">

        <div>

            <h2>Dados do setor</h2>

            <small>
                Modifique as informações abaixo e salve as alterações.
            </small>

        </div>

    </div>

    <form method="POST"
          action="{{ url_for('editar_setor', id=setor['id']) }}">

        <div class="grid-form">

            <div class="grupo-formulario">

                <label for="nome">
                    Nome do setor
                </label>

                <input
                    id="nome"
                    type="text"
                    name="nome"
                    value="{{ setor['nome'] }}"
                    placeholder="Digite o nome do setor"
                    autocomplete="off"
                    required>

            </div>

        </div>


        <div class="grupo-formulario">

            <label class="campo-checkbox">

                <input
                    type="checkbox"
                    name="ativo"
                    {% if setor["ativo"] == 1 %}checked{% endif %}>

                <span>
                    Setor ativo
                </span>

            </label>

            <small>
                Apenas setores ativos poderão ser selecionados nas novas rondas.
            </small>

        </div>


        <div class="acoes-form">

            <a href="{{ url_for('listar_setores') }}"
               class="btn btn-secondary">

                Cancelar

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Salvar Alterações

            </button>

        </div>

    </form>

</div>

{% endblock %}
