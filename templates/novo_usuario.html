{% extends "base.html" %}

{% block conteudo %}

<div class="cabecalho-pagina">

    <div>

        <h1 class="titulo-pagina">
            Novo Usuário
        </h1>

        <p class="subtitulo">
            Cadastre um novo usuário e defina o nível de acesso ao sistema.
        </p>

    </div>

    <a href="{{ url_for('listar_usuarios') }}"
       class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>

        Voltar

    </a>

</div>


<div class="card">

    <div class="cabecalho-card">

        <div>

            <h2>Dados do usuário</h2>

            <small>
                Preencha os campos abaixo para concluir o cadastro.
            </small>

        </div>

    </div>

    <form method="POST"
          action="{{ url_for('novo_usuario') }}">

        <div class="grid-form">

            <div class="grupo-formulario">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    id="nome"
                    type="text"
                    name="nome"
                    value="{{ nome or '' }}"
                    placeholder="Digite o nome completo"
                    autocomplete="name"
                    required>

            </div>


            <div class="grupo-formulario">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    value="{{ email or '' }}"
                    placeholder="usuario@exemplo.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="grupo-formulario">

                <label for="senha">
                    Senha
                </label>

                <input
                    id="senha"
                    type="password"
                    name="senha"
                    placeholder="Mínimo de 6 caracteres"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <div class="grupo-formulario">

                <label for="perfil">
                    Perfil de acesso
                </label>

                <select
                    id="perfil"
                    name="perfil"
                    required>

                    <option value="">
                        Selecione um perfil
                    </option>

                    <option value="Administrador"
                        {% if perfil == "Administrador" %}selected{% endif %}>

                        Administrador

                    </option>

                    <option value="Gerente"
                        {% if perfil == "Gerente" %}selected{% endif %}>

                        Gerente

                    </option>

                    <option value="Enfermeiro"
                        {% if perfil == "Enfermeiro" %}selected{% endif %}>

                        Enfermeiro

                    </option>

                </select>

            </div>

        </div>


        <div class="grupo-formulario">

            <label class="campo-checkbox">

                <input
                    type="checkbox"
                    name="ativo"
                    {% if ativo is not defined or ativo == 1 %}checked{% endif %}>

                <span>
                    Usuário ativo
                </span>

            </label>

            <small>
                Usuários inativos não poderão acessar o sistema.
            </small>

        </div>


        <div class="acoes-form">

            <a href="{{ url_for('listar_usuarios') }}"
               class="btn btn-secondary">

                Cancelar

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Cadastrar Usuário

            </button>

        </div>

    </form>

</div>

{% endblock %}
