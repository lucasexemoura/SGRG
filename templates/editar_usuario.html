{% extends "base.html" %}

{% block conteudo %}

<div class="cabecalho-pagina">

    <div>

        <h1 class="titulo-pagina">
            Editar Usuário
        </h1>

        <p class="subtitulo">
            Atualize os dados e o nível de acesso do usuário.
        </p>

    </div>

    <a href="{{ url_for('listar_usuarios') }}"
       class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>

        Voltar

    </a>

</div>


<div class="card">

    <div class="cabecalho-card">

        <div>

            <h2>Dados do usuário</h2>

            <small>
                Edite as informações abaixo e salve as alterações.
            </small>

        </div>

    </div>

    <form method="POST"
          action="{{ url_for('editar_usuario', id=usuario['id']) }}">

        <div class="grid-form">

            <div class="grupo-formulario">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    id="nome"
                    type="text"
                    name="nome"
                    value="{{ usuario['nome'] }}"
                    placeholder="Digite o nome completo"
                    autocomplete="name"
                    required>

            </div>


            <div class="grupo-formulario">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    value="{{ usuario['email'] }}"
                    placeholder="usuario@exemplo.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="grupo-formulario">

                <label for="perfil">
                    Perfil de acesso
                </label>

                <select
                    id="perfil"
                    name="perfil"
                    required>

                    <option value="Administrador"
                        {% if usuario["perfil"] == "Administrador" %}selected{% endif %}>

                        Administrador

                    </option>

                    <option value="Gerente"
                        {% if usuario["perfil"] == "Gerente" %}selected{% endif %}>

                        Gerente

                    </option>

                    <option value="Enfermeiro"
                        {% if usuario["perfil"] == "Enfermeiro" %}selected{% endif %}>

                        Enfermeiro

                    </option>

                </select>

            </div>

        </div>


        <div class="grupo-formulario">

            <label class="campo-checkbox">

                <input
                    type="checkbox"
                    name="ativo"
                    {% if usuario["ativo"] == 1 %}checked{% endif %}>

                <span>
                    Usuário ativo
                </span>

            </label>

            <small>
                Usuários inativos não poderão acessar o sistema.
            </small>

        </div>


        <div class="acoes-form">

            <a href="{{ url_for('listar_usuarios') }}"
               class="btn btn-secondary">

                Cancelar

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Salvar Alterações

            </button>

        </div>

    </form>

</div>

{% endblock %}
